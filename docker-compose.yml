services:
  redis:
    image: redis:alpine
    container_name: metaadmin-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - metaadmin_network

  db:
    image: postgres:15
    container_name: metaadmin-db
    environment:
      POSTGRES_DB: ${DB_NAME:-metaadmin_db}
      POSTGRES_USER: ${DB_USER:-metaadmin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - metaadmin_network

  web:
    build: .
    container_name: metaadmin-web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-metaadmin_db}
      - DB_USER=${DB_USER:-metaadmin_user}
      - DB_PASSWORD=${DB_PASSWORD:-secure_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - metaadmin_network
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

volumes:
  postgres_data:

networks:
  metaadmin_network:
    driver: bridge
