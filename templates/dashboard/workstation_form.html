{% extends 'base/base.html' %}

{% block title %}{{ title }} - MetaAdmin{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{% url 'dashboard:workstation_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Назад к списку
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-gear"></i> {{ title }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Название участка *</label>
                                <input type="text" name="name" id="name" class="form-control" 
                                       value="{{ workstation.name|default:'' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="short_name" class="form-label fw-bold">Сокращение *</label>
                                <input type="text" name="short_name" id="short_name" class="form-control" 
                                       value="{{ workstation.short_name|default:'' }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-bold">Подразделение</label>
                        <select name="department" id="department" class="form-select">
                            <option value="">— Без подразделения —</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" 
                                    {% if workstation and workstation.department.id == dept.id %}selected{% endif %}>
                                {{ dept.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="schedule_type" class="form-label fw-bold">Режим работы</label>
                        <select name="schedule_type" id="schedule_type" class="form-select">
                            <option value="5_2" {% if workstation and workstation.schedule_type == '5_2' %}selected{% endif %}>
                                5/2 (Пн-Пт)
                            </option>
                            <option value="2_2" {% if workstation and workstation.schedule_type == '2_2' %}selected{% endif %}>
                                2/2 (сменный)
                            </option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="work_start" class="form-label fw-bold">Начало смены</label>
                                <input type="time" name="work_start" id="work_start" class="form-control" 
                                       value="{{ workstation.work_start|default:'08:00'|time:'H:i' }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="work_end" class="form-label fw-bold">Окончание смены</label>
                                <input type="time" name="work_end" id="work_end" class="form-control" 
                                       value="{{ workstation.work_end|default:'17:00'|time:'H:i' }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="hours_per_day" class="form-label fw-bold">Часов в день</label>
                                <input type="number" name="hours_per_day" id="hours_per_day" class="form-control" step="0.5"
                                       value="{{ workstation.hours_per_day|default:'8.0' }}">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="color" class="form-label fw-bold">Цвет</label>
                                <input type="color" name="color" id="color" class="form-control form-control-color" 
                                       value="{{ workstation.color|default:'#007bff' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3 form-check mt-4">
                                <input type="checkbox" name="is_active" id="is_active" class="form-check-input" 
                                       {% if workstation.is_active or not workstation %}checked{% endif %}>
                                <label for="is_active" class="form-check-label fw-bold">Активен</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'dashboard:workstation_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
