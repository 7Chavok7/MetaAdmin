{% extends 'base/base.html' %}

{% block title %}Удаление KPI - MetaAdmin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Подтверждение удаления</h5>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-award" style="font-size: 48px; color: #dc3545;"></i>
                <h4 class="mt-3">Вы уверены?</h4>
                <p class="text-muted">
                    Вы собираетесь удалить KPI <strong>{{ kpi.name }}</strong>.
                </p>
                <p class="text-muted">Это действие нельзя отменить.</p>
                
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <a href="{% url 'dashboard:kpi_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Отмена
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
