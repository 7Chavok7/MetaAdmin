{% extends 'base/base.html' %}

{% block title %}{{ title }} - MetaAdmin{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{% url 'dashboard:kpi_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Назад к списку
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-award"></i> {{ title }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Название KPI *</label>
                        <input type="text" name="name" id="name" class="form-control" 
                               value="{{ kpi.name|default:'' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="type" class="form-label fw-bold">Тип KPI</label>
                        <select name="type" id="type" class="form-select">
                            {% for value, label in type_choices %}
                            <option value="{{ value }}" {% if kpi.type == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <hr>
                    <h6 class="fw-bold">Настройка бонуса</h6>
                    <p class="text-muted small">Заполните нужные поля. Можно комбинировать.</p>
                    
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="bonus_amount" class="form-label">Фиксированный бонус (руб.)</label>
                                <input type="number" name="bonus_amount" id="bonus_amount" class="form-control" step="0.01"
                                       value="{{ kpi.bonus_amount|default:'0' }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="bonus_percent" class="form-label">Бонус (%) от оклада</label>
                                <input type="number" name="bonus_percent" id="bonus_percent" class="form-control" step="0.01"
                                       value="{{ kpi.bonus_percent|default:'0' }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="skill_price" class="form-label">Цена за навык (руб.)</label>
                                <input type="number" name="skill_price" id="skill_price" class="form-control" step="0.01"
                                       value="{{ kpi.skill_price|default:'0' }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" id="is_active" class="form-check-input" 
                               {% if kpi.is_active or not kpi %}checked{% endif %}>
                        <label for="is_active" class="form-check-label fw-bold">Активен</label>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'dashboard:kpi_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
